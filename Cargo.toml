[package]
name = "notin"
version = "0.1.0"
edition = "2024"
description = "Dictado offline: hablas y queda en texto en un Markdown"

[dependencies]
chrono = "0.4.45"
cpal = "0.18.2"
dirs = "7.0.0"
hound = "3"
# Adelgazado al mínimo: winit + femtovg; sin el system-tray ni el clipboard
# que slint trae por defecto (nada de eso necesita la historia #1).
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
thiserror = "2.0.21"

[build-dependencies]
slint-build = "1.18.1"
