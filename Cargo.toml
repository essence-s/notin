[package]
name = "notin"
version = "0.1.0"
edition = "2024"
description = "Dictado offline: hablas y queda en texto en un Markdown"

[dependencies]
chrono = "0.4.45"
cpal = "0.18.2"
dirs = "7.0.0"
hound = "3"
# Adelgazado al mínimo: winit + femtovg; sin el system-tray ni el clipboard
# que slint trae por defecto (nada de eso necesita la historia #1).
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
# Usado para set_event_loop_quit_on_last_window_closed(false) en el servidor IPC
i-slint-backend-selector = "=1.18.1"
thiserror = "2.0.21"
rubato = "5"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "sys"] }
ureq = "3"
clap = { version = "4", features = ["derive"] }
bzip2 = "0.5"
tar = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = "0.59"

[build-dependencies]
slint-build = "1.18.1"
